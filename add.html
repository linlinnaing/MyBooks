<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>စာအုပ်စာရင်း ပြုလုပ်ရန်</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap">
<style>
body{margin:0;background:#EAF3FF;color:#1B1633;font:400 16px/1.8 "Noto Sans Myanmar","Myanmar Text",Padauk,system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:28px;line-height:1.5;margin:0 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border-radius:14px;padding:12px;margin:10px 0}
.row b{grid-column:1/-1;overflow-wrap:anywhere}
input[type=text]{padding:9px 11px;border:2px solid #1B1633;border-radius:10px;font:inherit;width:100%}
button,a.b{background:#6B4EFF;color:#fff;border:0;border-radius:999px;padding:9px 18px;font:700 16px inherit;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 6px 6px 0}
textarea{width:100%;min-height:220px;border:2px solid #1B1633;border-radius:12px;padding:10px;font:14px/1.5 monospace}
</style>
</head>
<body><div class="w">
<h1>စာအုပ်စာရင်း ပြုလုပ်ရန်</h1>
<p>၁။ စာအုပ်ဖိုင်တွေကို <b>books</b> folder ထဲ ထည့်ထားပါ။ ၂။ ဒီမှာ အဲဒီဖိုင်တွေကို ရွေးပါ။ ၃။ ထွက်လာတဲ့ စာရင်းကို <b>books.json</b> အဖြစ် အစားထိုးပါ။</p>
<input type="file" id="f" accept=".pdf,.txt,.md" multiple>
<div id="rows"></div>
<button id="gen" type="button">books.json ပြုလုပ်မည်</button>
<textarea id="out" readonly aria-label="books.json"></textarea>
<button id="cp" type="button">ကူးယူမည်</button><a class="b" id="dl" download="books.json">books.json ဒေါင်းလုဒ်</a>
</div>
<script>
const $=s=>document.querySelector(s);let old=[];
fetch('books.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{if(Array.isArray(d))old=d}).catch(()=>{});
$('#f').onchange=e=>{
  $('#rows').innerHTML='';
  [...e.target.files].forEach(f=>{
    const d=document.createElement('div');d.className='row';d.dataset.file='books/'+f.name;
    const b=document.createElement('b');b.textContent=f.name;
    const t=document.createElement('input');t.type='text';t.placeholder='စာအုပ်အမည်';t.value=f.name.replace(/\.[^.]+$/,'');
    const a=document.createElement('input');a.type='text';a.placeholder='စာရေးသူ';
    d.append(b,t,a);$('#rows').append(d);
  });
};
$('#gen').onclick=()=>{
  const list=old.slice();
  document.querySelectorAll('.row').forEach(r=>{
    const [t,a]=r.querySelectorAll('input'),file=r.dataset.file;
    if(list.some(x=>x.file===file))return;
    list.push({title:t.value.trim()||file,author:a.value.trim(),file:file});
  });
  const s=JSON.stringify(list,null,2);$('#out').value=s;
  $('#dl').href=URL.createObjectURL(new Blob([s],{type:'application/json'}));
};
$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#out').value)}catch(e){$('#out').select()}};
</script></body></html>
